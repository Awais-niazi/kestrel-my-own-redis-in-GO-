# Kestrel configuration.
#
# Every directive here can also be given as a command-line flag
# (--maxmemory 256mb) or as an environment variable (KESTREL_MAXMEMORY=256mb).
# Precedence, lowest to highest: defaults, this file, environment, flags.
#
# Values marked "startup only" cannot be changed with CONFIG SET.

# ---------------------------------------------------------------- Network ---
bind 127.0.0.1
port 6380                             # startup only
tcp-backlog 511                       # startup only
tcp-keepalive 300
timeout 0                             # idle client timeout in seconds; 0 disables
maxclients 20000

# --------------------------------------------------------------- Security ---
requirepass ""
protected-mode yes                    # refuse non-loopback clients when no password is set
tls-port 0                            # startup only
tls-cert-file ""                      # startup only
tls-key-file ""                       # startup only
tls-ca-cert-file ""                   # startup only
tls-auth-clients no                   # startup only; requires tls-ca-cert-file

# Dangerous commands can be renamed or, with an empty target, removed.
# rename-command FLUSHALL ""
# rename-command CONFIG admin_config

# ----------------------------------------------------------------- Memory ---
maxmemory 0
maxmemory-policy noeviction
maxmemory-samples 5
memory-limit-overhead-factor 1.4      # multiplier for debug.SetMemoryLimit (ADR-013)

# The memory figure is an estimate, not a measurement: Go owns the heap and
# per-allocation accounting is not available. Expect it to be within roughly
# 15% of reality, and set maxmemory to 60-70% of the container limit rather
# than the 90% that would be reasonable for a C implementation.

# ----------------------------------------------------------------- Engine ---
databases 16                          # startup only
shards 16                             # startup only; must be a power of two (ADR-003)
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size 128
set-max-intset-entries 512
set-max-listpack-entries 128
zset-max-listpack-entries 128
zset-max-listpack-value 64

# --------------------------------------------------------- Protocol limits ---
proto-max-bulk-len 512mb
proto-max-multibulk-len 1048576
proto-max-inline-len 65536
client-query-buffer-limit 1gb

# ------------------------------------------------------------- Expiration ---
active-expire yes
active-expire-cpu-percent 25
active-expire-sample-size 20

# ------------------------------------------------------------ Persistence ---
# NOT IMPLEMENTED IN THIS BUILD. These directives are accepted so that a
# production configuration loads unchanged, but the append log and the
# snapshotter are M3 work. Data is held in memory only and is lost on restart.
dir /var/lib/kestrel                  # startup only
appendonly yes
appendfsync everysec                  # always | everysec | no
auto-rewrite-percentage 100
auto-rewrite-min-size 64mb
snapshot-interval 900
snapshot-batch-keys 10000             # keys per lock acquisition (ADR-009)
corrupt-log-policy truncate           # truncate | refuse

# ------------------------------------------------------------ Replication ---
# NOT IMPLEMENTED IN THIS BUILD (M4).
replicaof ""                          # startup only
replica-read-only yes
repl-backlog-size 64mb
repl-backlog-ttl 3600
min-replicas-to-write 0
min-replicas-max-lag 10

# ---------------------------------------------------------- Observability ---
admin-port 6381                       # startup only
metrics-enabled yes                   # startup only
pprof-enabled no                      # startup only
slowlog-log-slower-than 10000         # microseconds; negative disables
slowlog-max-len 128
track-command-latency yes             # times every command; costs two clock reads
loglevel info
logformat json

# ---------------------------------------------------------------- Runtime ---
gogc 200
